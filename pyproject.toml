[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-signal-workflow"
version = "0.1.0"
description = "Turn relevant hiring into evidence-backed SDR research briefs."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
creative-signal = "creative_signal.cli:main"

[tool.setuptools.packages.find]
include = ["creative_signal*"]

[tool.setuptools.package-data]
creative_signal = ["demo.json"]
